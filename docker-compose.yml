version: '3.8'

services:
  broker:
    build: .
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID}
      PAYPAL_SECRET: ${PAYPAL_SECRET}
      ADMIN_SECRET: ${ADMIN_SECRET}
      BASE_URL: http://localhost:3000
      PORT: 3000
    volumes:
      - ./broker.db:/app/broker.db
    restart: unless-stopped
